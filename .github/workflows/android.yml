name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.jvmargs=-Xmx4096m"
        run: |
          mkdir -p android/app/src/main/res/values
          printf '<resources>\n  <color name="splashscreen_background">#FFFFFF</color>\n  <color name="colorPrimary">#023c69</color>\n  <color name="colorPrimaryDark">#023c69</color>\n</resources>\n' > android/app/src/main/res/values/colors.xml
          echo "android.enableJetifier=false" >> android/gradle.properties
          cd android && ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: financial-life-apk
          path: android/app/build/outputs/apk/release/*.apk
          
